<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vectra — design studio clone</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=Poppins:wght@300;400;600;700&family=Montserrat:wght@300..900&family=Space+Grotesk:wght@300..700&family=Bebas+Neue&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=DM+Serif+Display&family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400..700;1,400..700&display=swap">
<!--
  Vectra v2 — single-file clone of a pro design app's Vector and Pixel studios.

  ARCHITECTURE
    S.doc      document: artboard size + a TREE of layers (groups have children). Index 0 = bottom.
    S.sel      selected layer ids. Panels + context bar edit the selection.
    STUDIOS    each studio = a list of toolbar slots; a slot with >1 tool is a FLYOUT.
    TD         tool definitions: name, shortcut, icon, status, and the full guide text.
    History    snapshot stack (begin/end). Pixel bitmaps live in BMP and snapshots store only keys.
    Pixel      brush engine paints into canvases; each finished stroke becomes a new bitmap version.
    render()   state -> SVG canvas + overlay + panels. State is the only source of truth.
-->
<style>
:root{--bg0:#18181a;--bg1:#222225;--bg2:#2a2a2e;--bg3:#34343a;--bg4:#404047;--line:#38383e;--tx:#ececee;--tx2:#a3a3ab;--tx3:#6f6f78;--acc:#5ac8e0;--accTx:#082a33;--sel:#3ea6ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg0);color:var(--tx);font:13px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:disabled{opacity:.3;cursor:default}
input,select{font:inherit;color:var(--tx);background:var(--bg0);border:1px solid var(--line);border-radius:6px;padding:3px 6px;height:26px;outline:none}
input:focus,select:focus{border-color:var(--acc)}
input[type=number]{width:62px}
input[type=checkbox]{height:auto;accent-color:#e0457b}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--tx);height:auto}
input[type=color]{width:30px;padding:1px;height:26px}
.hidden{display:none!important}
#app{display:grid;grid-template-columns:56px 1fr 320px;grid-template-rows:56px 40px 1fr 28px;height:100vh}
#app.noui{grid-template-columns:0 1fr 0;grid-template-rows:0 0 1fr 0}
#app.noui #top,#app.noui #ctx,#app.noui #tools,#app.noui #right,#app.noui #status{display:none}
#top{grid-column:1/-1;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--bg1);border-bottom:1px solid var(--line)}
.logo{border:0;cursor:pointer;width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#5ac8e0,#2f6bff);display:grid;place-items:center;font-weight:800;color:#06202a;font-size:18px;margin-right:4px;flex:none}
.studios{display:flex;align-items:center;background:var(--bg0);border-radius:12px;padding:3px;gap:2px}
.studio{display:flex;align-items:center;gap:7px;white-space:nowrap;height:34px;padding:0 12px;border-radius:9px;color:var(--tx2);font-size:14px}
.studio:hover{color:var(--tx);background:var(--bg2)}
.studio.on{background:var(--acc);color:var(--accTx);font-weight:600}
.tb{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--tx2);flex:none}
.tb:not(:disabled):hover{background:var(--bg3);color:var(--tx)}
.tb.on{background:var(--bg4);color:var(--tx)}
.tb.dim{opacity:.35}.tb.dim:hover{opacity:.6}
.grp{display:flex;gap:1px;padding:0 5px;border-left:1px solid var(--line)}
.spacer{flex:1}
.export{display:flex;align-items:center;height:34px;background:var(--bg3);border-radius:9px;overflow:hidden;flex:none}
.export button{height:100%;padding:0 12px;display:flex;align-items:center;gap:6px}
.export button:hover{background:var(--bg4)}
.export .dd{border-left:1px solid var(--line);padding:0 8px}
.menu{position:absolute;z-index:50;background:#1f1d1c;border:1px solid #4a4a50;border-radius:14px;padding:6px;box-shadow:0 18px 40px rgba(0,0,0,.5);min-width:220px;max-height:80vh;overflow:auto}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:6px 10px;border-radius:9px;font-size:13.5px;text-align:left}
.menu button:hover,.menu button.cur{background:var(--bg3)}
.menu .mk{margin-left:auto;color:var(--tx3);font-size:11px;padding-left:12px}
.mi{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#10251a;flex:none}
.badge{font-size:9.5px;padding:1px 5px;border-radius:4px;text-transform:uppercase;letter-spacing:.03em;flex:none}
.b-working{background:#1d4d35;color:#7ff0b0}.b-partial{background:#4d3a12;color:#ffcf70}.b-info{background:#3a3a42;color:#b8b8c2}
#ctx{grid-column:1/-1;display:flex;align-items:center;gap:9px;padding:0 12px;background:var(--bg2);border-bottom:1px solid var(--line);white-space:nowrap;overflow-x:auto}
#ctx>*{flex:none}
#ctx label{display:flex;align-items:center;gap:5px;color:var(--tx2)}
#ctx .sep{width:1px;height:20px;background:var(--line);flex:none}
#ctx .btn{background:var(--bg3);border-radius:6px;padding:4px 11px;height:26px}
#ctx .btn:hover{background:var(--bg4)}
#ctx .btn.pri{background:var(--acc);color:var(--accTx);font-weight:600}
#ctx .tog{min-width:26px;height:26px;border-radius:6px;background:var(--bg3);padding:0 7px}
#ctx .tog.on{background:var(--acc);color:var(--accTx);font-weight:600}
#ctx .what{color:var(--tx);font-weight:600;min-width:84px}
#ctx input[type=range]{width:80px}
#tools{grid-row:3;grid-column:1;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:2px;overflow-y:auto;overflow-x:hidden}
.tool{width:42px;height:38px;border-radius:9px;display:grid;place-items:center;color:var(--tx2);position:relative;flex:none}
.tool:hover{background:var(--bg3);color:var(--tx)}
.tool.on{background:var(--bg0);color:var(--tx);box-shadow:inset 0 0 0 1px var(--bg4)}
.tool .fly{position:absolute;right:3px;bottom:3px;width:0;height:0;border-left:5px solid transparent;border-bottom:5px solid var(--tx3)}
.tool.on .fly{border-bottom-color:var(--tx)}
.toolwells{margin-top:auto;position:relative;width:44px;height:50px;flex:none}
.toolwells span{position:absolute;width:28px;height:28px;border-radius:50%}
#stage{grid-row:3;grid-column:2;position:relative;overflow:hidden;background:#202023;touch-action:none}
#doctab{position:absolute;top:0;left:0;right:0;height:26px;background:var(--bg1);border-bottom:1px solid var(--line);display:flex;align-items:flex-end;gap:2px;padding:0 6px;font-size:12px;z-index:4;overflow-x:auto}
.dtab{display:flex;align-items:center;gap:6px;height:22px;padding:0 8px 0 10px;border-radius:7px 7px 0 0;background:var(--bg2);color:var(--tx2);white-space:nowrap;cursor:pointer;flex:none}
.dtab.on{background:var(--bg0);color:var(--tx)}.dtab .x{width:16px;height:16px;border-radius:4px;display:grid;place-items:center;color:var(--tx3)}.dtab .x:hover{background:var(--bg4);color:var(--tx)}
.dtab.add{padding:0 9px;background:none}.dtinfo{margin-left:auto;align-self:center;color:var(--tx3);white-space:nowrap;padding-left:10px;flex:none}
#rulerX,#rulerY,#rulerC{position:absolute;z-index:3;background:#1b1b1e}#rulerX{top:26px;left:18px;width:calc(100% - 18px);height:18px;cursor:ns-resize;border-bottom:1px solid var(--line)}#rulerY{top:44px;left:0;width:18px;height:calc(100% - 44px);cursor:ew-resize;border-right:1px solid var(--line)}#rulerC{top:26px;left:0;width:18px;height:18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
#app.norulers #rulerX,#app.norulers #rulerY,#app.norulers #rulerC{display:none}
#board{position:absolute;left:0;top:0;transform-origin:0 0}
#board>*{position:absolute;left:0;top:0}
#content{overflow:visible}
#overlay{overflow:visible;pointer-events:none}
#overlay [data-guide],#overlay [data-gs],#overlay [data-ge],#overlay [data-h],#overlay [data-n],#overlay [data-hn],#overlay [data-rot],#overlay [data-ab],#overlay [data-slice],#overlay [data-sh]{pointer-events:all}
#live,#selc{pointer-events:none}
#selc{image-rendering:pixelated}
#right{grid-row:3;grid-column:3;background:var(--bg1);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.panel{display:flex;flex-direction:column;min-height:0}
#pTop{flex:0 1 auto;min-height:0;overflow-y:auto;border-bottom:1px solid var(--line);max-height:62%}
#pLayers{flex:1 0 200px}
.tabs{display:flex;flex-wrap:wrap;gap:2px;padding:6px 8px;background:var(--bg0);position:sticky;top:0;z-index:2}
.tabs button{padding:5px 9px;border-radius:7px;color:var(--tx2)}
.tabs button.on{background:var(--bg3);color:var(--tx)}
.tabbody{padding:10px 12px}
.crow{display:flex;justify-content:space-between;align-items:flex-start}
.wells{position:relative;width:70px;height:62px}
.well{position:absolute;width:38px;height:38px;border-radius:50%;border:2px solid #555}
.well.fill{left:0;top:0}.well.stroke{left:20px;top:16px;background:var(--bg1)!important}
.well.front{z-index:2;outline:2px solid var(--tx);outline-offset:1px}
.none{background:linear-gradient(135deg,transparent 45%,#e2453c 45%,#e2453c 55%,transparent 55%),#fff!important}
.wbtn{position:absolute;width:22px;height:22px;display:grid;place-items:center;color:var(--tx2);border-radius:6px}
.wbtn:hover{background:var(--bg3);color:var(--tx)}
#wheel{width:176px;height:176px;cursor:crosshair;touch-action:none}
.vals{display:grid;grid-template-columns:auto 1fr auto 1fr auto 1fr;gap:5px 6px;align-items:center;margin-top:8px;color:var(--tx2)}
.vals input{width:100%}
.hexrow{display:flex;align-items:center;gap:6px;margin-top:6px;color:var(--tx2)}.hexrow input{flex:1}
.oprow{display:flex;align-items:center;gap:8px;margin-top:8px;color:var(--tx2)}.oprow input[type=range]{flex:1}
#harm{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:10px}
.hg{font-size:11px;color:var(--tx2)}.hg div{display:flex;gap:2px;margin-top:3px;flex-wrap:wrap}
.sw{width:15px;height:15px;border-radius:4px;border:1px solid rgba(255,255,255,.15)}
.sw:hover{transform:scale(1.15)}
.swgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}.swgrid .sw{width:100%;height:auto;aspect-ratio:1}
.form{display:grid;grid-template-columns:90px 1fr;gap:8px;align-items:center;color:var(--tx2)}
#guide h2{font-size:16px;margin:2px 0 4px;display:flex;align-items:center;gap:8px}
#guide h4{margin:14px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--acc)}
#guide p{margin:4px 0;line-height:1.5;color:var(--tx)}
#guide .muted{color:var(--tx2)}
#guide table{width:100%;border-collapse:collapse;font-size:12px}
#guide td{padding:4px 4px;border-top:1px solid var(--line);vertical-align:top;line-height:1.4}
#guide td:first-child{color:var(--tx);white-space:nowrap;padding-right:10px}
#guide td:last-child{color:var(--tx2)}
.sib{display:flex;gap:8px;align-items:flex-start;padding:6px;border-radius:8px;cursor:pointer}
.sib:hover{background:var(--bg2)}.sib.cur{background:#2c3b4b}
.sib .ti{color:var(--tx2);flex:none;margin-top:1px}
.sib b{font-weight:600}.sib small{display:block;color:var(--tx2);line-height:1.4;margin-top:2px}
.gbtn{margin-top:12px;width:100%;background:var(--bg3);border-radius:7px;padding:7px}
.gbtn:hover{background:var(--bg4)}
.lhead{display:flex;align-items:center;gap:6px;padding:8px 10px;color:var(--tx2);border-bottom:1px solid var(--line)}
.lhead select{flex:1}
#llist{flex:1;overflow-y:auto;padding:4px 0}
.lrow{display:flex;align-items:center;gap:6px;height:32px;padding:0 8px;border-left:3px solid transparent}
.lrow:hover{background:var(--bg2)}
.lrow.on{background:#2c3b4b;border-left-color:var(--sel)}
.lrow.over{box-shadow:inset 0 2px 0 var(--acc)}
.lrow.hiddenL .lname{color:var(--tx3)}
.lb{width:24px;height:24px;display:grid;place-items:center;color:var(--tx2);border-radius:5px;flex:none}
.lb:hover{background:var(--bg3);color:var(--tx)}
.thumb{width:24px;height:24px;border-radius:4px;border:1px solid #555;display:grid;place-items:center;font-family:Georgia,serif;font-size:13px;flex:none;background:#fff center/cover;color:#111}
.thumb.chk{background-color:#fff;background-image:linear-gradient(45deg,#ccc 25%,transparent 25%,transparent 75%,#ccc 75%),linear-gradient(45deg,#ccc 25%,transparent 25%,transparent 75%,#ccc 75%);background-size:8px 8px;background-position:0 0,4px 4px}
.lname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lname input{width:100%}
.empty{padding:20px 14px;color:var(--tx3);line-height:1.5}
.lfoot{display:flex;justify-content:flex-end;gap:2px;padding:6px 8px;border-top:1px solid var(--line)}
#status{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 12px;background:var(--bg1);border-top:1px solid var(--line);color:var(--tx2);font-size:12px}
#status b{color:var(--tx)}#hint{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#zoomLbl{cursor:pointer}
.modalBg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:100}
.modal{background:var(--bg1);border:1px solid var(--line);border-radius:14px;padding:18px 20px;min-width:360px;max-width:900px;max-height:86vh;overflow:auto;user-select:text}
.modal h3{margin:0 0 12px;font-size:16px}
.modal h4{margin:18px 0 6px;color:var(--acc);font-size:13px}
.modal .row{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;position:sticky;bottom:-18px;background:var(--bg1);padding:8px 0}
.modal .row button{padding:6px 14px;border-radius:7px;background:var(--bg3)}
.modal .row button.pri{background:var(--acc);color:var(--accTx);font-weight:600}
.ref{width:100%;border-collapse:collapse;font-size:12.5px}
.ref th{text-align:left;color:var(--tx2);font-weight:500;padding:6px;border-bottom:1px solid var(--line)}
.ref td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.45}
.ref td:nth-child(1){color:var(--tx3);white-space:nowrap}.ref td:nth-child(2){white-space:nowrap;font-weight:600}
.keys{display:grid;grid-template-columns:1fr auto;gap:5px 24px;font-size:12.5px}
.keys kbd{font:inherit;background:var(--bg3);border-radius:5px;padding:1px 6px}
.keys .h{grid-column:1/-1;color:var(--acc);margin-top:10px;font-weight:600}
#home{position:fixed;inset:0;z-index:90;background:var(--bg0);display:grid;grid-template-columns:250px 1fr;grid-template-rows:60px 1fr}
#home .hTop{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 18px;background:var(--bg1);border-bottom:1px solid var(--line)}
#home .hTop h1{font-size:17px;margin:0;font-weight:600}
#home .hSide{background:var(--bg1);border-right:1px solid var(--line);padding:12px 10px;overflow-y:auto}
#home .hSide .it{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;color:var(--tx2);cursor:pointer;width:100%}
#home .hSide .it:hover{background:var(--bg2);color:var(--tx)}#home .hSide .it.on{background:#2c3b4b;color:var(--tx)}
#home .hSide .it.drop{box-shadow:inset 0 0 0 2px var(--acc)}
#home .hSide h5{margin:16px 10px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);font-weight:600}
#home .hMain{overflow-y:auto;padding:18px 26px 40px}
#home .crumbs{display:flex;align-items:center;gap:6px;color:var(--tx2);font-size:15px;margin-bottom:14px}
#home .crumbs button{color:var(--tx2);padding:2px 6px;border-radius:6px}#home .crumbs button:hover{background:var(--bg2);color:var(--tx)}#home .crumbs b{color:var(--tx);font-weight:600;padding:2px 6px}
#home .hbtn{display:flex;align-items:center;gap:7px;background:var(--bg3);border-radius:8px;padding:7px 12px}#home .hbtn:hover{background:var(--bg4)}#home .hbtn.pri{background:var(--acc);color:var(--accTx);font-weight:600}
#home .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;margin-bottom:26px}
#home .sec{font-size:12px;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;margin:4px 0 10px;font-weight:600}
.card{background:var(--bg1);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;position:relative}
.card:hover{border-color:var(--bg4)}.card.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}.card.drop{border-color:var(--acc);background:#1d2b38}
.card .th{height:150px;background:#2b2b30 center/contain no-repeat;display:grid;place-items:center;color:var(--tx3)}
.card .meta{padding:9px 11px}.card .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card .sub{color:var(--tx3);font-size:11.5px;margin-top:3px}
.card .more{position:absolute;right:6px;top:6px;width:28px;height:28px;border-radius:7px;background:rgba(0,0,0,.55);display:grid;place-items:center;opacity:0}.card:hover .more{opacity:1}
.fcard{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bg1);border:1px solid var(--line);border-radius:10px;cursor:pointer;position:relative}
.fcard:hover{border-color:var(--bg4)}.fcard.drop{border-color:var(--acc);background:#1d2b38}.fcard .more{margin-left:auto;opacity:.6}
#home .emptyH{color:var(--tx3);padding:30px 0;line-height:1.6}
.fmtGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:6px}
.fmt{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:6px}
.fmt:hover,.fmt.on{border-color:var(--acc)}.fmt .box{background:#fff;border-radius:2px;align-self:center}.fmt small{color:var(--tx3)}
.fxs{border-top:1px solid var(--line);padding:8px 0}.fxs:first-of-type{border-top:0}
.fxh{display:flex;align-items:center;gap:8px;font-weight:600}.fxh label{display:flex;align-items:center;gap:8px;cursor:pointer;flex:1}
.fxr{display:grid;grid-template-columns:78px 1fr 46px;gap:8px;align-items:center;color:var(--tx2);margin-top:6px;font-size:12px}
.fxr input[type=number]{width:46px;height:24px;padding:2px 4px}.fxr input[type=range]{width:100%}
.stylegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stile{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--tx2)}
.stile:hover{border-color:var(--acc);color:var(--tx)}.stile svg{width:54px;height:40px}
.chev{width:16px;height:16px;display:grid;place-items:center;color:var(--tx3);flex:none;font-size:10px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:#111;border:1px solid var(--line);padding:9px 14px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:200;max-width:560px;text-align:center;line-height:1.45}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button class="logo" id="logoBtn" title="Home — your saved work (Cmd/Ctrl+O)">V</button>
    <button class="tb" id="bHome" title="Home — saved work & folders (Cmd/Ctrl+O)"></button><button class="tb" id="bSave" title="Save (Cmd/Ctrl+S)"></button>
    <div class="studios" id="studios"></div>
    <button class="tb" id="moreStudios" title="More studios">»</button>
    <div class="grp"><button class="tb" id="bUndo" title="Undo (Cmd/Ctrl+Z)"></button><button class="tb" id="bRedo" title="Redo (Cmd/Ctrl+Shift+Z)"></button></div>
    <div class="grp" id="boolGrp"></div>
    <div class="grp"><button class="tb" id="bFlipH" title="Flip horizontal"></button><button class="tb" id="bFlipV" title="Flip vertical"></button></div>
    <div class="grp" id="alignGrp"></div>
    <div class="grp"><button class="tb" id="bBack" title="Send backward (Cmd/Ctrl+[)"></button><button class="tb" id="bFwd" title="Bring forward (Cmd/Ctrl+])"></button><button class="tb on" id="bSnap" title="Snapping"></button></div>
    <div class="spacer"></div>
    <div class="export"><button id="bExport"><span id="icExport"></span>Export</button><button class="dd" id="bExportDD">▾</button></div>
    <button class="tb" id="bHelp" title="Keyboard shortcuts (?)"></button>
  </div>
  <div id="ctx"></div>
  <div id="tools"></div>

function shapeIcon(k,s){ let d='';
  if(k==='rect') d='M4 5h16v14H4z'; else if(k==='ellipse') d='M3 12a9 7 0 1 0 18 0a9 7 0 1 0-18 0'; else if(k==='roundrect') d='M8 5h8a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V9a4 4 0 0 1 4-4z';
  else if(k==='qr') d='M4 4h6v6H4z M14 4h6v6h-6z M4 14h6v6H4z M14 14h2v2h-2z M18 18h2v2h-2z M14 18h2 M18 14h2';
  else { const S=SHAPES[k],g=S.g(defParams(k)); d=g.subs.map(sp=>'M'+sp.map(([x,y])=>(3+x*18).toFixed(1)+' '+(3+y*18).toFixed(1)).join('L')+(g.open?'':'Z')).join(' '); }
  return `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="${d}"/></svg>`; }

function updateCtxGeom(){ const u=union(selL()); if(!u) return; ['x','y','w','h'].forEach(k=>{const i=ctx.querySelector(`[data-k="${k}"]`); if(i) i.value=Math.round(u[k])}); }
function focusText(){ const i=$('#ctxText'); if(i){ i.focus(); i.select(); } }
ctx.addEventListener('change',e=>{ const k=e.target.dataset.k,v=e.target.value; if(!k||k==='text') return;
  if(k==='pfFit') return act(()=>selL().forEach(l=>{ if(l.type==='pframe') l.fit=v; }));
  if(k==='rot') return act(()=>selL().forEach(l=>{ if(l.type!=='artboard') l.rot=((+v%360)+360)%360; }));
  if(k==='qrText') return act(()=>selL().forEach(l=>{ if(l.type==='qr') l.text=v||' '; })); if(k==='qrBg') return act(()=>selL().forEach(l=>{ if(l.type==='qr') l.qbg=e.target.checked?'#ffffff':null; }));
  if(k==='contourMode'){ S.contourMode=v; return; } if(k==='blobW'){ S.def.blobW=Math.max(1,+v); return; } if(k==='pathOff'){ end(); return; }
  if(['gMargin','gCols','gGutter'].includes(k)) return act(()=>{ const ab=byId(activeBoard().id); ab.guides=Object.assign({margin:72,cols:3,gutter:24,show:false},ab.guides||{},{[{gMargin:'margin',gCols:'cols',gGutter:'gutter'}[k]]:Math.max(k==='gCols'?1:0,+v)}); });
  if(k.startsWith('sl:')) return act(()=>{ const sl=sliceById(S.sliceSel); if(!sl) return; const f=k.slice(3); sl[f]=['x','y','w','h','scale'].includes(f)?+v:v; });
  if(k==='autoSel'){ S.autoSel=e.target.checked; return; } if(k==='contig'){ S.contiguous=e.target.checked; return; }
  if(['x','y','w','h'].includes(k)){ const ob=union(selL()); return act(()=>mapSel(ob,{...ob,[k]:+v},origsOf())); }
  if(k==='radius') return act(()=>{ S.def.radius=+v; selL().flatMap(leaves).forEach(l=>{ if(l.type==='rect') l.radius=+v; }); });
  if(k.startsWith('sp:')) return act(()=>{ const pk=k.slice(3); selL().forEach(l=>{ if(l.type==='shape') l.params[pk]=+v; }); });
  if(k==='font'||k==='size') return act(()=>{ const val=k==='size'?Math.max(2,+v):v; S.def[k]=val; selL().flatMap(leaves).forEach(l=>{ if(l.type==='text') l[k]=val; }); });
  if(k==='sw') return act(()=>{ S.def.sw=+v; selL().flatMap(leaves).forEach(l=>{ if(l.type==='path'){ l.sw=+v; if(!l.stroke) l.stroke='#111111'; } }); });
  if(k==='gtype') return act(()=>selL().forEach(l=>{ if(l.grad) l.grad.type=v; }),'Gradient type');
  if(k.startsWith('gsc:')||k.startsWith('gso:')) return act(()=>selL().forEach(l=>{ if(!l.grad) return; l.grad.stops=gradStops(l.grad).map(x=>({...x})); const i=+k.slice(4); if(k[2]==='c') l.grad.stops[i].c=v; else l.grad.stops[i].o=Math.max(0,Math.min(100,+v))/100; }),'Gradient stop');
  if(k==='abPreset'){ if(v==='custom') return; S.abPreset=v; const sab=selL().some(l=>l.type==='artboard'); if(sab){ let n=0; act(()=>{ n=resizeSelectedBoards(v); }); fit(); toast(`Resized ${n} artboard${n>1?'s':''} to ${v.split('|')[1]} (${presetSize(v).join(' × ')})`); } else { toast('Next artboard: '+v.replace('|',' · ')); renderCtx(); } return; }
  if(k==='abCount'){ S.abCount=Math.max(1,Math.min(35,+v||1)); renderCtx(); return; } if(k==='abBg') return act(()=>{ const a=selL().find(l=>l.type==='artboard'); if(a) a.bg=v; }); if(k==='abName') return act(()=>{ const a=selL().find(l=>l.type==='artboard'); if(a&&v.trim()) a.name=v.trim(); });
  if(k==='btip'){ S.brush.tip=v; return; } if(k==='bpress'){ S.brush.press=e.target.checked; return; } if(k==='wrapText') return act(()=>selL().forEach(l=>{ l.wrapText=e.target.checked; }),'Text wrap'); if(k==='masterSel') return act(()=>{ const a=byId(activeBoard().id); a.masterId=v||null; },'Apply master');
  if(k==='bsize') { S.brush.size=Math.max(1,+v); return; } if(k==='tol') { S.tol=Math.max(0,Math.min(255,+v)); return; } });
ctx.addEventListener('input',e=>{ const k=e.target.dataset.k;
  if(k==='pathOff'){ begin(); selL().forEach(l=>{ if(l.onPath) l.pathOff=+e.target.value; }); renderCanvas(); return; }
  if(k==='bop'||k==='bflow'||k==='bhard'){ S.brush[{bop:'opacity',bflow:'flow',bhard:'hardness'}[k]]=e.target.value/100; e.target.nextElementSibling.textContent=e.target.value; return; }

  if(k.startsWith('mode:')){ S.selMode=k.slice(5); toast({object:'Select Object: clicks pick the exact object, even inside groups',group:'Select Group: clicks pick the group that directly contains the object',layer:'Select Layer: clicks pick the top-level layer',board:'Select Board: clicking any object selects the whole artboard it sits on'}[S.selMode]); renderCtx(); return; }

  if(k.startsWith('align:')) return act(()=>{ const a=k.slice(6); S.def.align=a; selL().forEach(l=>{ if(l.type==='text') l.align=a; }); });
  if(k==='bold'||k==='italic') return act(()=>{ const T=selL().flatMap(leaves).filter(l=>l.type==='text'); const val=!(T[0]||S.def)[k]; S.def[k]=val; T.forEach(l=>{ l[k]=val; if(k==='bold') l.weight=val?700:400; }); });
  if(k==='gremove') return act(()=>selL().forEach(l=>delete l.grad));

window.addEventListener('keydown',e=>{
  const typing=/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName), mod=e.metaKey||e.ctrlKey, k=e.key.toLowerCase();
  if(document.querySelector('.modalBg')) return;
  if(!$('#home').classList.contains('hidden')){ if(e.key==='Escape'&&!typing) closeHome(); if(mod&&k==='n'){ e.preventDefault(); newDocDialog(); } return; }
  if(typing){ if(e.key==='Escape') document.activeElement.blur(); return; }
  if(e.code==='Space'){ if(!space){space=true; stage.style.cursor='grab';} e.preventDefault(); return; }
  const has=()=>S.sel.length>0;
  if(mod&&k==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; } if(mod&&k==='y'){ e.preventDefault(); redo(); return; }
  if(mod&&k==='d'){ e.preventDefault(); if(isPx()) deselect(); else if(has()) act(()=>duplicateSel()); return; }
  if(mod&&k==='j'){ e.preventDefault(); if(has()) act(()=>duplicateSel()); return; }
  if(mod&&(k==='c'||k==='x')){ if(!has()) return; e.preventDefault(); copySel(); if(k==='x'){ act(deleteSel); toast('Cut'); } else toast(`Copied ${CLIP.length} item${CLIP.length>1?'s':''}`); return; }
  if(mod&&k==='v'&&e.shiftKey){ e.preventDefault(); pasteStyle(); return; }
  if(mod&&k==='v'){ PASTE_FIRED=false; setTimeout(()=>{ if(!PASTE_FIRED) pasteClip(); },60); return; }
  if(mod&&k==='a'){ e.preventDefault(); if(isPx()){ selectAllPx(); return; } S.sel=e.altKey?[]:S.doc.layers.flatMap(l=>l.type==='artboard'?l.children:[l]).filter(l=>l.visible&&!l.locked).map(l=>l.id); setTool('move'); return; }
  if(mod&&k==='i'&&e.shiftKey){ e.preventDefault(); invertSel(); return; }
  if(mod&&(e.code==='BracketRight'||e.code==='BracketLeft')){ e.preventDefault(); if(has()) act(()=>arrange(e.code==='BracketRight'?(e.shiftKey?'front':'fwd1'):(e.shiftKey?'back':'back1'))); return; }
  if(mod&&k==='r'){ e.preventDefault(); toggleRulers(); return; }
  if(mod&&e.key==="'"){ e.preventDefault(); S.grid.show=!S.grid.show; renderOverlay(); toast('Grid '+(S.grid.show?'on':'off')); return; }
  if(mod&&k==='w'){ e.preventDefault(); closeTab(CUR); return; }
  if(mod&&k==='0'){ e.preventDefault(); fit(); return; }
  if(mod&&k==='1'){ e.preventDefault(); const r=stage.getBoundingClientRect(); zoomAt(r.width/2,r.height/2,1/S.zoom); return; }
  if(mod&&(k==='='||k==='+')){ e.preventDefault(); const r=stage.getBoundingClientRect(); zoomAt(r.width/2,r.height/2,1.25); return; }
  if(mod&&k==='-'){ e.preventDefault(); const r=stage.getBoundingClientRect(); zoomAt(r.width/2,r.height/2,.8); return; }
  if(mod&&e.key==='Enter'){ e.preventDefault(); if(has()) act(toCurves); return; }
  if(mod&&k==='g'){ e.preventDefault(); if(has()) act(e.shiftKey?ungroupSel:groupSel); return; }
  if(mod&&(k==='b'||k==='i')){ e.preventDefault(); if(selL().some(l=>l.type==='text')) act(()=>{ const key=k==='b'?'bold':'italic'; selL().forEach(l=>{ if(l.type==='text') l[key]=!l[key]; }); }); return; }
  if(mod&&k==='s'){ e.preventDefault(); saveDoc(e.shiftKey); return; }
  if(mod&&k==='o'){ e.preventDefault(); openHome(); return; }
  if(mod&&k==='n'){ e.preventDefault(); newDocDialog(); return; }
  if(mod) return;

/* =====================================================================
   19. GEOMETRY ENGINE (Paper.js, loaded on demand) — booleans, knife, shape builder, vector flood fill
   ===================================================================== */
function loadPaper(){ if(!window.paper) return Promise.reject(new Error('missing')); if(!paper.project) paper.setup(document.createElement('canvas')); return Promise.resolve(); }
function rrAbs(x,y,w,h,R){ R=Math.min(R,w/2,h/2); if(R<=0) return [{x,y},{x:x+w,y},{x:x+w,y:y+h},{x,y:y+h}]; const o=[],A=(cx,cy,a0)=>{ for(let i=0;i<=8;i++){ const a=a0+i/8*Math.PI/2; o.push({x:cx+Math.cos(a)*R,y:cy+Math.sin(a)*R}); } };
  A(x+w-R,y+R,-Math.PI/2); A(x+w-R,y+h-R,0); A(x+R,y+h-R,Math.PI/2); A(x+R,y+R,Math.PI); return o; }
function polysOf(l){ let P=null; const U=(sp)=>sp.map(([u,v])=>({x:l.x+u*l.w,y:l.y+v*l.h}));
  if(l.type==='rect') P=[rrAbs(l.x,l.y,l.w,l.h,l.radius||0)];
  else if(l.type==='ellipse'){ const o=[]; for(let i=0;i<72;i++){ const a=i/72*TAU; o.push({x:l.x+l.w/2+Math.cos(a)*l.w/2,y:l.y+l.h/2+Math.sin(a)*l.h/2}); } P=[o]; }
  else if(l.type==='shape'){ const g=SHAPES[l.kind].g(l.params); if(g.open) return null; P=g.subs.map(U); }
  else if(l.type==='compound') P=l.subs.map(U);
  else if(l.type==='path'&&l.pts.length>2) P=[curvePts(l)];
  else if(l.type==='pframe') P=l.kind==='ellipse'?polysOf({...l,type:'ellipse'}):[rrAbs(l.x,l.y,l.w,l.h,l.radius||0)];
  if(!P) return null; const b=bbox(l),cx=b.x+b.w/2,cy=b.y+b.h/2; if(l.flipX||l.flipY) P=P.map(sp=>sp.map(q=>({x:l.flipX?2*cx-q.x:q.x,y:l.flipY?2*cy-q.y:q.y}))); if(l.rot) P=P.map(sp=>sp.map(q=>rotPt(q,l.rot,{x:cx,y:cy}))); return P; }
const toItem=P=>new paper.CompoundPath({children:P.map(sp=>new paper.Path({segments:sp.map(q=>[q.x,q.y]),closed:true})),fillRule:'evenodd'});
function itemPolys(it){ const c=it.clone({insert:false}); c.flatten(0.5); const paths=c.children?c.children.filter(x=>x.segments):[c]; return paths.map(pt=>pt.segments.map(sg=>({x:sg.point.x,y:sg.point.y}))).filter(sp=>sp.length>2&&Math.abs(polyArea(sp))>.5); }
const polyArea=sp=>{ let a=0; sp.forEach((q,i)=>{ const r=sp[(i+1)%sp.length]; a+=q.x*r.y-r.x*q.y; }); return a/2; };
// split an item into separate connected pieces (outer ring + its holes)
function components(it){ const P=itemPolys(it); if(P.length<=1) return P.length?[P]:[]; const inside=(pt,sp)=>{ let c=false; for(let i=0,j=sp.length-1;i<sp.length;j=i++){ const a=sp[i],b=sp[j]; if(((a.y>pt.y)!==(b.y>pt.y))&&(pt.x<(b.x-a.x)*(pt.y-a.y)/(b.y-a.y)+a.x)) c=!c; } return c; };
  const depth=P.map((sp,i)=>P.filter((o,j)=>j!==i&&inside(sp[0],o)).length); const outers=P.map((sp,i)=>i).filter(i=>depth[i]%2===0);
  return outers.map(oi=>[P[oi],...P.filter((sp,i)=>depth[i]%2===1&&depth[i]===depth[oi]+1&&inside(sp[0],P[oi]))]); }
function compoundFrom(P,src){ const all=P.flat(),xs=all.map(q=>q.x),ys=all.map(q=>q.y),x=Math.min(...xs),y=Math.min(...ys),w=Math.max(Math.max(...xs)-x,1),h=Math.max(Math.max(...ys)-y,1);
  const l=newLayer('compound',{x,y,w,h,subs:P.map(sp=>sp.map(q=>[(q.x-x)/w,(q.y-y)/h]))}); ['fill','fillA','stroke','strokeA','sw','cap','join','dash','opacity','blend'].forEach(k=>{ if(src&&src[k]!==undefined) l[k]=src[k]; }); if(src&&src.grad) l.grad=clone(src.grad); if(src&&src.fx) l.fx=clone(src.fx); return l; }
const docOrder=ls=>{ const o=[]; walk(S.doc.layers,l=>{ if(ls.includes(l)) o.push(l); }); return o; };
function divideItems(items){ let pieces=[items[0]]; for(const it of items.slice(1)){ const np=[]; let uni=null; pieces.forEach(p=>{ np.push(p.intersect(it)); np.push(p.subtract(it)); uni=uni?uni.unite(p):p; }); np.push(it.subtract(uni)); pieces=np; }
  return pieces.flatMap(p=>components(p)).filter(c=>c.length); }
function replaceWith(originals,newLayers){ const top=originals[originals.length-1],r=find(top.id); r.arr.splice(r.i+1,0,...newLayers); originals.forEach(o=>{ const f=find(o.id); if(f) f.arr.splice(f.i,1); }); S.sel=newLayers.map(l=>l.id); }
async function geo(){ try{ await loadPaper(); return true; }catch(e){ toast('Geometry engine failed to start.'); return false; } }
async function booleanOp(op){ const ls=selL().flatMap(leaves).filter(l=>polysOf(l)); if(ls.length<2) return toast('Select at least two shapes, rectangles, ellipses or closed curves.'); if(!await geo()) return;
  const order=docOrder(ls), items=order.map(l=>toItem(polysOf(l))); let out=[];
  if(op==='Divide') out=divideItems(items).map(P=>compoundFrom(P,order[0]));
  else { let r=items[0]; for(const it of items.slice(1)) r=op==='Add'?r.unite(it):op==='Subtract'?r.subtract(it):op==='Intersect'?r.intersect(it):r.exclude(it); const P=itemPolys(r); if(P.length) out=[compoundFrom(P,order[0])]; }
  paper.project.clear(); if(!out.length) return toast(op+' produced an empty result (the shapes may not overlap).');
  act(()=>{ out.forEach(l=>l.name=op==='Divide'?'Piece':op+' result'); replaceWith(order,out); }); toast(`${op}: ${out.length} shape${out.length>1?'s':''}`); }
async function knifeCut(a,b){ const len=Math.hypot(b.x-a.x,b.y-a.y); if(len<4){ renderOverlay(); return; } if(!await geo()) return;
  const pool=(S.sel.length?selL().flatMap(leaves):S.doc.layers.flatMap(leaves)).filter(l=>l.visible&&!l.locked&&polysOf(l)); const nx=-(b.y-a.y)/len*.6, ny=(b.x-a.x)/len*.6;
  const band=new paper.Path({segments:[[a.x+nx,a.y+ny],[b.x+nx,b.y+ny],[b.x-nx,b.y-ny],[a.x-nx,a.y-ny]],closed:true}); let cuts=0;
  begin(); pool.forEach(l=>{ const comps=components(toItem(polysOf(l)).subtract(band)); if(comps.length<2) return; cuts++; const parts=comps.map((P,i)=>{ const c=compoundFrom(P,l); c.name=l.name+' piece '+(i+1); return c; }); replaceWith([l],parts); });
  paper.project.clear(); end(); render(); toast(cuts?`Cut ${cuts} shape${cuts>1?'s':''}`:'The line has to cross right through a shape to cut it.'); }
async function shapeBuild(pts,alt){ const ls=selL().flatMap(leaves).filter(l=>polysOf(l)); if(ls.length<2){ renderOverlay(); return toast('Shape Builder: select two or more overlapping shapes first.'); } if(!await geo()) return;
  const order=docOrder(ls), comps=divideItems(order.map(l=>toItem(polysOf(l)))), pieces=comps.map(P=>toItem(P)); const hit=pieces.map(pc=>pts.some(q=>pc.contains(new paper.Point(q.x,q.y))));
  if(!hit.some(Boolean)){ paper.project.clear(); renderOverlay(); return toast('Drag across the regions you want to merge.'); }
  let keep=comps.filter((c,i)=>!hit[i]).map(P=>compoundFrom(P,order[0]));
  if(!alt){ let m=null; pieces.forEach((pc,i)=>{ if(hit[i]) m=m?m.unite(pc):pc; }); const P=itemPolys(m); if(P.length){ const c=compoundFrom(P,order[0]); c.name='Built shape'; keep=[...keep,c]; } }
  paper.project.clear(); act(()=>replaceWith(order,keep)); toast(alt?'Removed regions':'Merged regions'); }
async function vectorFloodFill(p){ const ab=boardAt(p); const pool=(ab?ab.children.flatMap(leaves):S.doc.layers.filter(l=>l.type!=='artboard').flatMap(leaves)).filter(l=>l.visible&&polysOf(l)); if(!pool.length) return toast('Vector Flood Fill: click inside an area enclosed by shapes.'); if(!await geo()) return;
  const order=docOrder(pool), comps=divideItems(order.map(l=>toItem(polysOf(l)))); const P=comps.find(c=>toItem(c).contains(new paper.Point(p.x,p.y))); paper.project.clear();
  if(!P) return toast('No enclosed area there.'); act(()=>{ const l=compoundFrom(P,{fill:S.def.fill||'#0028fc',fillA:1,stroke:null,sw:0}); l.name='Flood fill'; const top=order[order.length-1],r=find(top.id); r.arr.splice(r.i+1,0,l); S.sel=[l.id]; }); }

function fitBoard(a){ if(!a) return; const r=stage.getBoundingClientRect(); S.zoom=Math.min((r.width-80)/a.w,(r.height-100)/a.h); S.panX=(r.width-a.w*S.zoom)/2-a.x*S.zoom; S.panY=26+(r.height-26-a.h*S.zoom)/2-a.y*S.zoom; renderCanvas(); }
const sliceById=id=>(S.doc.slices||[]).find(x=>x.id===id);
function updateSliceCtx(){ const sl=sliceById(S.sliceSel); if(!sl) return; ['x','y','w','h'].forEach(k=>{ const i=ctx.querySelector(`[data-k="sl:${k}"]`); if(i) i.value=Math.round(sl[k]); }); }
async function exportRegion(B,format,scale,name){ B={x:B.x,y:B.y,w:B.w,h:B.h}; const css=await embeddedFontCSS(); if(format==='svg'){ download(new Blob([svgString(B,css)],{type:'image/svg+xml'}),name+'.svg'); toast('Exported '+name+'.svg'); return; }
  const img=new Image(); img.onload=()=>{ const c=newCanvas(B.w*scale,B.h*scale),g=c.getContext('2d'); if(format==='jpg'){ g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); } g.scale(scale,scale); g.drawImage(img,0,0);
    c.toBlob(b=>{ download(b,`${name}${scale>1?'@'+scale+'x':''}.${format}`); toast(`Exported ${name} (${c.width}×${c.height} ${format.toUpperCase()})`); },format==='jpg'?'image/jpeg':'image/png',.92); };
  img.onerror=()=>toast('Export failed: a layer could not be rendered.'); img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgString(B,css)); }
let EXP_UNCHECK=new Set();
function exportItems(){ return [...boards().map(a=>({id:a.id,kind:'Artboard',name:a.name,box:a,o:(a.exp=a.exp||{format:'png',scale:1})})),...(S.doc.slices||[]).map(sl=>({id:sl.id,kind:'Slice',name:sl.name,box:sl,o:sl}))]; }
function renderExport(){ const items=exportItems();
  $('#exportPanel').innerHTML=`<p style="color:var(--tx2);margin:0 0 8px;font-size:12px;line-height:1.5">Every artboard and slice can be exported. Tick what you want, choose format and scale, then export. Add slices with the Slice tool in the Slice studio.</p>`
   +(items.length?items.map(it=>`<div style="display:flex;align-items:center;gap:6px;padding:6px 0;border-top:1px solid var(--line)"><input type="checkbox" data-ex="${it.id}" ${EXP_UNCHECK.has(it.id)?'':'checked'}><div style="flex:1;min-width:0"><div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(it.name)}</div><div style="color:var(--tx3);font-size:11px">${it.kind} · ${Math.round(it.box.w)}×${Math.round(it.box.h)}</div></div>
      <select data-exf="${it.id}" style="width:62px">${['png','jpg','svg'].map(f=>`<option value="${f}" ${it.o.format===f?'selected':''}>${f.toUpperCase()}</option>`).join('')}</select><select data-exs="${it.id}" style="width:52px">${[1,2,3].map(x=>`<option value="${x}" ${+it.o.scale===x?'selected':''}>${x}x</option>`).join('')}</select></div>`).join(''):'<p style="color:var(--tx3)">Nothing to export yet.</p>')
   +`<button class="gbtn" data-exgo style="background:var(--acc);color:var(--accTx);font-weight:600">Export checked</button><button class="gbtn" data-expdf>Export all boards as one PDF</button><label style="display:flex;gap:6px;align-items:center;color:var(--tx2);margin-top:8px"><input type="checkbox" data-exbleed ${S.pdfBleed?'checked':''}>Add 3 mm bleed to PDF</label>`; }
function exportChecked(all){ const its=exportItems().filter(it=>all||!EXP_UNCHECK.has(it.id)); if(!its.length) return toast('Nothing ticked to export.'); its.forEach((it,i)=>setTimeout(()=>exportRegion(it.box,it.o.format,+it.o.scale,S.doc.name+' - '+it.name),i*450)); }

async function exportPDF(bleed){ const B=boards().length?boards().filter(a=>!a.master||boards().length===1):[{x:0,y:0,w:W(),h:H(),name:'Page'}]; toast('Building PDF…'); const css=await embeddedFontCSS(); const bl=bleed?11.34:0, pages=[];
